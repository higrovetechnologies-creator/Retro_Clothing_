<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base metadata. Route-specific values are replaced by Seo/prerender. -->
    <title>Retro Clothing Tirunelveli | Trendy Fashion &amp; Streetwear</title>
    <meta
      name="description"
      content="Shop Retro Clothing in Tirunelveli for shirts, T-shirts, oversized tees, pants, casual wear and streetwear. Order online and across India."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://retroclothing.in/" />
    <meta name="theme-color" content="#08080a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Retro Clothing" />
    <meta property="og:title" content="Retro Clothing Tirunelveli | Trendy Fashion &amp; Streetwear" />
    <meta property="og:description" content="Shop Retro Clothing in Tirunelveli for shirts, T-shirts, oversized tees, pants, casual wear and streetwear." />
    <meta property="og:url" content="https://retroclothing.in/" />
    <meta property="og:image" content="https://retroclothing.in/hero-poster.png" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Retro Clothing Tirunelveli | Trendy Fashion &amp; Streetwear" />
    <meta name="twitter:description" content="Shop Retro Clothing in Tirunelveli for shirts, T-shirts, oversized tees, pants, casual wear and streetwear." />
    <meta name="twitter:image" content="https://retroclothing.in/hero-poster.png" />

    <!-- Organization Schema -->
    <script type="application/ld+json" id="ld-organization">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Retro Clothing",
        "url": "https://retroclothing.in/",
        "logo": "https://retroclothing.in/Retro-logo.png",
        "sameAs": ["https://instagram.com/retroclothing"]
      }
    </script>

    <!-- Website Schema -->
    <script type="application/ld+json" id="ld-website">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Retro Clothing",
        "url": "https://retroclothing.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://retroclothing.in/collection?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Local Business Schema -->
    <script type="application/ld+json" id="ld-localbusiness">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Retro Clothing",
        "image": "https://retroclothing.in/hero-poster.png",
        "url": "https://retroclothing.in/",
        "telephone": "+918667873216",
        "email": "hello@retroclothing.in",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "33/A Mela Mount Road, Rajiv Gandhi Nagar, Valukodai, Town",
          "addressLocality": "Tirunelveli",
          "addressRegion": "Tamil Nadu",
          "postalCode": "627006",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 8.7297747,
          "longitude": 77.6766274
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "10:00",
            "closes": "21:00"
          }
        ],
        "sameAs": ["https://instagram.com/retroclothing"]
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
